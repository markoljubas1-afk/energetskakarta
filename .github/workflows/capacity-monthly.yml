# Installed generation capacity per production type (ENTSO-E A68), every country and year since 2015, for
# the generation and country pages. The platform publishes it once a year for the year ahead, so once a month
# is plenty; an unchanged document is not rewritten. A failed request, a country without any year, a total
# that halved, or a published year gone missing turns the run red and the published document stays.
name: capacity-monthly

on:
  schedule:
    - cron: "41 4 3 * *" # 3rd of each month, 04:41 UTC
  workflow_dispatch:
    inputs:
      allow_drop:
        description: "Publish even if a published year is missing"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: capacity
  cancel-in-progress: false

jobs:
  update:
    # The schedule is opt-in (SCHEDULE_ENTSOE=true), like the other ENTSO-E jobs; manual runs always run.
    if: github.event_name != 'schedule' || vars.SCHEDULE_ENTSOE == 'true'
    runs-on: ubuntu-24.04
    # about 105 requests at 5 to 15 seconds each (survey of 2026-11-27): 10 to 25 minutes
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        env:
          HAS_TOKEN: ${{ secrets.ENTSOE_TOKEN != '' }}
          HAS_R2: ${{ secrets.R2_ACCOUNT_ID != '' && secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' && secrets.R2_BUCKET != '' }}
        run: |
          missing=""
          [ "$HAS_TOKEN" = "true" ] || missing="$missing secret ENTSOE_TOKEN;"
          [ "$HAS_R2" = "true" ] || missing="$missing secrets R2_*;"
          if [ -n "$missing" ]; then
            echo "::error::Not configured:$missing see infra/README.md"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: python -m pip install -e .
      - name: Fetch installed capacity
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: energymap energy capacity-fetch --data-dir data >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to the data bucket
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          ALLOW_DROP: ${{ inputs.allow_drop && '--allow-drop' || '' }}
        # ALLOW_DROP is unquoted on purpose: empty, it must not become an argument
        run: energymap energy capacity-publish-r2 --data-dir data $ALLOW_DROP >> "$GITHUB_STEP_SUMMARY"
      - name: Report failure as an issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Mjesečno ažuriranje instalirane snage (ENTSO-E) nije uspjelo"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Ponovno nije uspjelo: $run_url"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "Posao: $run_url. Objavljeni podaci nisu promijenjeni."
          fi
