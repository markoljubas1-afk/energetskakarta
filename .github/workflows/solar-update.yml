# Solar potential (Faza 34-2): the Global Solar Atlas rasters of the map's eight countries (PVOUT, kWh per
# kWp a year, CC BY 4.0, data by Solargis) are put together into one picture of the region and a grid of
# values, both published to the data bucket under solar/. The atlas is a long-term average that changes
# only with a new version of the atlas, so this runs when a person starts it, not on a schedule. About
# 170 MB is downloaded per run. If a file is not what the pipeline was written against the run is red and
# what is published stays as it was. No API key is needed.
name: solar-update

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - name: Check configuration
        env:
          HAS_R2: ${{ secrets.R2_ACCOUNT_ID != '' && secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' && secrets.R2_BUCKET != '' }}
        run: |
          if [ "$HAS_R2" != "true" ]; then
            echo "::error::Not configured: R2_* secrets are required (infra/README.md)"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: python -m pip install -e .
      - name: Download the rasters
        run: energymap solar fetch --data-dir data >> "$GITHUB_STEP_SUMMARY"
      - name: Build the picture and the values, and publish them
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: energymap solar publish-r2 --data-dir data >> "$GITHUB_STEP_SUMMARY"
