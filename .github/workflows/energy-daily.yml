# Daily generation and load (ENTSO-E): pull what is published, refetch the last days, publish.
name: energy-daily

on:
  schedule:
    - cron: "30 5 * * *" # 05:30 UTC, after the platform has published the previous day
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to refetch"
        default: "7"
        required: true
      price_months:
        description: "How many months of day-ahead price totals to fetch (2 daily; more to fill history)"
        default: "2"
        required: true

permissions:
  contents: read
  issues: write

concurrency:
  group: energy-publish
  cancel-in-progress: false

jobs:
  refresh:
    # The schedule is opt-in (SCHEDULE_ENTSOE=true under Settings → Variables), switched on once a manual run has
    # succeeded; until then scheduled runs are skipped instead of failing every time. Manual runs always run.
    if: github.event_name != 'schedule' || vars.SCHEDULE_ENTSOE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        env:
          HAS_TOKEN: ${{ secrets.ENTSOE_TOKEN != '' }}
          HAS_R2: ${{ secrets.R2_ACCOUNT_ID != '' && secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' && secrets.R2_BUCKET != '' }}
        run: |
          missing=""
          [ -n "$DATA_BASE_URL" ] || missing="$missing variable DATA_BASE_URL;"
          [ "$HAS_TOKEN" = "true" ] || missing="$missing secret ENTSOE_TOKEN;"
          [ "$HAS_R2" = "true" ] || missing="$missing secrets R2_*;"
          if [ -n "$missing" ]; then
            echo "::error::Not configured:$missing see infra/README.md"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: python -m pip install -e .
      - name: Pull published years
        run: energymap energy pull --data-dir data --baseline-url "$DATA_BASE_URL"
      - name: Refetch recent days
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
          DAYS: ${{ inputs.days || '7' }}
        run: energymap energy refresh --data-dir data --days "$DAYS"
      - name: Publish
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: energymap energy publish-r2 --data-dir data
      - name: Monthly day-ahead price totals
        # hours and days at or below zero per month, for the monthly reports; the published months are kept
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MONTHS: ${{ inputs.price_months || '2' }}
        run: energymap energy prices-r2 --months "$MONTHS"
      - name: Report failure as an issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Dnevno ažuriranje proizvodnje i potrošnje nije uspjelo"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Ponovno nije uspjelo: $run_url"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "Posao: $run_url. Objavljeni podaci nisu promijenjeni."
          fi
