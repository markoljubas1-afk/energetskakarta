# Geothermal layer (Faza 21): checks overrides/geothermal.yaml, downloads the Global Heat Flow Database and
# publishes geothermal/current.json. The sources change a few times a year: monthly is plenty.
name: geothermal-update

on:
  schedule:
    - cron: "40 3 5 * *" # 5th of each month, 03:40 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["overrides/geothermal.yaml"]

permissions:
  contents: read

concurrency:
  group: geothermal
  cancel-in-progress: false

jobs:
  update:
    # The schedule is opt-in (SCHEDULE_OSM=true), like the other source updates; manual runs and changes to
    # the curated file always run.
    if: github.event_name != 'schedule' || vars.SCHEDULE_OSM == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - name: Check configuration
        env:
          HAS_R2: ${{ secrets.R2_ACCOUNT_ID != '' && secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' && secrets.R2_BUCKET != '' }}
        run: |
          if [ "$HAS_R2" != "true" ]; then
            echo "::error::Not configured: R2_* secrets are required (infra/README.md)"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: python -m pip install -e .
      - name: Check the sites and build the heat-flow grid
        run: energymap geothermal fetch --data-dir data --sites ../overrides/geothermal.yaml >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to the data bucket
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: energymap geothermal publish-r2 --data-dir data
