# Record days for the live layer (Faza 39): which days hold Croatia's records is read off the published daily
# data (most wind, most solar, highest and lowest demand, highest renewable share), and the hours of those
# days are fetched from ENTSO-E in the live layer's own shape. A day ENTSO-E no longer has is left out; with
# no day at all nothing is published.
# Daily since 2026-11-18: the map announces a new record above the map while it is news (web/src/data/
# alerts.ts), so the list has to notice one. A day that is already published is not fetched again, so a run
# without a new record costs only the reading of the daily files.
name: live-days

on:
  schedule:
    - cron: "40 6 * * *" # after energy-daily (05:30 UTC) has published the previous days
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-days
  cancel-in-progress: false

jobs:
  days:
    # the schedule is opt-in, like the other ENTSO-E jobs (SCHEDULE_ENTSOE=true); manual runs always run
    if: github.event_name != 'schedule' || vars.SCHEDULE_ENTSOE == 'true'
    runs-on: ubuntu-24.04
    # one day is as much work as one hourly refresh (7 to 11 minutes at ENTSO-E's request rate); five record
    # days did not fit in half an hour (the first run, 2026-11-17, was cancelled by the limit)
    timeout-minutes: 120
    defaults:
      run:
        working-directory: pipeline
    env:
      DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        env:
          HAS_TOKEN: ${{ secrets.ENTSOE_TOKEN != '' }}
          HAS_R2: ${{ secrets.R2_ACCOUNT_ID != '' && secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' && secrets.R2_BUCKET != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_R2" != "true" ] || [ -z "$DATA_BASE_URL" ]; then
            echo "::error::Not configured: ENTSOE_TOKEN, R2_* secrets and the DATA_BASE_URL variable are required (infra/README.md)"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: python -m pip install -e .
      - name: Pull the published daily data
        run: energymap energy pull --data-dir data --baseline-url "$DATA_BASE_URL"
      - name: Pull the record days already published
        # their hours are history: only a day that is not there yet is asked of ENTSO-E
        run: |
          base="${DATA_BASE_URL%/}"
          mkdir -p data/live/days
          if curl -fsS "$base/live/days/index.json" -o /tmp/days-index.json; then
            for key in $(python -c "import json; print(' '.join(d['key'] for d in json.load(open('/tmp/days-index.json'))['days']))"); do
              curl -fsS "$base/$key" -o "data/$key" || rm -f "data/$key"
            done
          fi
      - name: Fetch the hours of the record days
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: energymap live days-fetch --data-dir data >> "$GITHUB_STEP_SUMMARY"
      - name: Publish
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: energymap live days-publish-r2 --data-dir data
