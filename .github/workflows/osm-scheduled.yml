# Weekly data update: download → build (guarded by the published build) → change report → tiles → publish.
# On failure the published data stays as it was and an issue is opened (or updated).
#
# Geofabrik refuses some GitHub runners and answers others (L-082; 2026-11-19, 2026-11-27). The download is
# therefore a job of its own, and when it cannot finish, `download-again` tries once more on a new machine,
# which usually has another address. The extracts reach the build through this run's cache.
name: osm-scheduled

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osm-publish # shared with osm-build: never two publications at once
  cancel-in-progress: false

jobs:
  download:
    # The schedule is opt-in (SCHEDULE_OSM=true under Settings → Variables), switched on once a manual run has
    # succeeded; until then scheduled runs are skipped instead of failing every time. Manual runs always run.
    if: github.event_name != 'schedule' || vars.SCHEDULE_OSM == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      # the run goes on to `download-again` instead of failing here
      ok: ${{ steps.fetch.outcome == 'success' }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - &checkout
        uses: actions/checkout@v4
      - &python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - &install
        run: python -m pip install -e .
      - &diagnostic
        name: Geofabrik connection (diagnostic)
        # Never fails the job: it says which addresses this runner gets for Geofabrik and what each protocol
        # answers, so that a failed download names its cause.
        run: |
          echo "runner address: $(curl -4 -sS -m 10 https://api.ipify.org || echo unknown)"
          getent ahosts download.geofabrik.de || echo "no address for download.geofabrik.de"
          for version in 4 6; do
            curl "-$version" -sS -o /dev/null -m 30 \
              -w "IPv$version: HTTP %{http_code} from %{remote_ip} in %{time_total}s\n" \
              https://download.geofabrik.de/index-v1-nogeom.json || echo "IPv$version failed, curl exit $?"
          done
      - &restore-previous
        name: Restore the previous extracts
        uses: actions/cache/restore@v4
        with:
          path: &raw |
            pipeline/data/raw
            pipeline/data/reference
          # the newest earlier run's; the MD5 check skips unchanged files
          key: osm-raw-${{ github.run_id }}
          restore-keys: osm-raw-
      - name: Download
        id: fetch
        continue-on-error: true
        run: energymap osm download --data-dir data
      - &save
        name: Keep the extracts for the build
        if: steps.fetch.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: *raw
          key: osm-raw-${{ github.run_id }}

  download-again:
    needs: download
    if: >-
      (github.event_name != 'schedule' || vars.SCHEDULE_OSM == 'true') &&
      needs.download.outputs.ok != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pipeline
    steps:
      - *checkout
      - *python
      - *install
      - *diagnostic
      - *restore-previous
      - name: Download
        id: fetch
        run: energymap osm download --data-dir data
      - *save

  update:
    needs: [download, download-again]
    # always(): `download-again` is skipped when the first download succeeded, which would skip this job too
    if: >-
      (github.event_name != 'schedule' || vars.SCHEDULE_OSM == 'true') && always() &&
      (needs.download.outputs.ok == 'true' || needs.download-again.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - *checkout
      - name: Check configuration
        env:
          HAS_R2: ${{ secrets.R2_ACCOUNT_ID != '' && secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' && secrets.R2_BUCKET != '' }}
        run: |
          missing=""
          [ -n "$DATA_BASE_URL" ] || missing="$missing variable DATA_BASE_URL;"
          [ "$HAS_R2" = "true" ] || missing="$missing secrets R2_*;"
          if [ -n "$missing" ]; then
            echo "::error::Not configured:$missing see infra/README.md"
            exit 1
          fi
      - *python
      - name: Install tippecanoe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tippecanoe
      - *install
      - name: Extracts downloaded in this run
        uses: actions/cache/restore@v4
        with:
          path: *raw
          key: osm-raw-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Global Energy Monitor source (optional)
        id: gem
        # assigned first: a failure inside $(...) as an echo argument would not stop the step
        run: |
          path=$(energymap sources gem-fetch --data-dir data --baseline-url "$DATA_BASE_URL")
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: EMODnet offshore data (optional)
        id: marine
        run: |
          # assigned first: a failure inside $(...) as an echo argument would not stop the step
          dir=$(energymap sources emodnet-fetch --data-dir data --baseline-url "$DATA_BASE_URL")
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Cities (Covenant of Mayors / JRC, CC BY 4.0)
        id: cities
        # A JRC outage must not silently drop the layer: the step may fail, but then the build compares
        # its counts with the published ones and refuses the drop (validate.check_counts).
        continue-on-error: true
        run: |
          energymap cities download --data-dir data
          echo "dir=data/cities" >> "$GITHUB_OUTPUT"
      - name: Build (compared with the published build)
        env:
          GEM_FILE: ${{ steps.gem.outputs.path }}
          MARINE_DIR: ${{ steps.marine.outputs.dir }}
          CITIES_DIR: ${{ steps.cities.outputs.dir }}
        run: |
          energymap osm build --data-dir data --baseline-url "$DATA_BASE_URL" \
            --overrides ../overrides/conflation.yaml ${GEM_FILE:+--gem "$GEM_FILE"} ${MARINE_DIR:+--marine "$MARINE_DIR"} \
            ${CITIES_DIR:+--cities "$CITIES_DIR"}
      - name: Change report
        run: energymap diff --data-dir data --baseline-url "$DATA_BASE_URL" --summary "$GITHUB_STEP_SUMMARY"
      - name: Tiles
        run: energymap tiles build --data-dir data
      - name: Publish to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: energymap publish r2 --data-dir data
      - name: Keep the build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osm-report
          path: |
            pipeline/data/out/builds/*/manifest.json
            pipeline/data/out/builds/*/diff.json
            pipeline/data/out/builds/*/conflation.json
          if-no-files-found: ignore
          retention-days: 90

  report:
    needs: [download, download-again, update]
    # also when both downloads failed and the build never started; a switched-off schedule skips everything
    if: >-
      (github.event_name != 'schedule' || vars.SCHEDULE_OSM == 'true') && always() &&
      github.event_name == 'schedule' && needs.download.result != 'skipped' && needs.update.result != 'success'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Report failure as an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Automatsko ažuriranje podataka nije uspjelo"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Ponovno nije uspjelo: $run_url"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$(printf '%s\n\n%s\n\n%s' \
              "Tjedno ažuriranje nije uspjelo: $run_url" \
              "Objavljeni podaci nisu promijenjeni; stranica i dalje prikazuje zadnju ispravnu verziju." \
              "Ako je build odbijen zbog velikog pada broja objekata, pogledaj izvještaj i po potrebi pokreni osm-build s allow_drop.")"
          fi
