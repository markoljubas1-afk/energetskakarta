# Photographs of plants (Faza 33): for plants whose OpenStreetMap record carries a Wikidata id, the image
# Wikidata names is copied from Wikimedia Commons into the data bucket in a reduced size, with its author
# and licence. The map shows the copy, so a visitor's browser is never sent to Wikimedia. Photographs
# change rarely, so once a month is plenty; an unchanged one is not fetched again. If Wikimedia answers
# with something unexpected, or the update would lose more than a fifth of the photographs, the run is red
# and the published index stays as it was. No API key is needed.
name: images-update

on:
  schedule:
    - cron: "50 2 8 * *" # 8th of each month, 02:50 UTC
  workflow_dispatch:
    inputs:
      allow_drop:
        description: "Publish even if far fewer photographs were found"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  update:
    # The schedule is opt-in (SCHEDULE_OSM=true), like the other source updates that need only the bucket;
    # manual runs always run.
    if: github.event_name != 'schedule' || vars.SCHEDULE_OSM == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        env:
          HAS_R2: ${{ secrets.R2_ACCOUNT_ID != '' && secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' && secrets.R2_BUCKET != '' }}
          DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
        run: |
          if [ "$HAS_R2" != "true" ]; then
            echo "::error::Not configured: R2_* secrets are required (infra/README.md)"
            exit 1
          fi
          if [ -z "$DATA_BASE_URL" ]; then
            echo "::error::DATA_BASE_URL is not set (Settings → Variables): the plants are read from the published data"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: python -m pip install -e .
      - name: Copy new photographs and publish their index
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
          # Wikimedia asks every client to say where its operator can be reached: the site's public address
          SITE_URL: ${{ vars.SITE_URL }}
          ALLOW_DROP: ${{ inputs.allow_drop }}
        run: |
          energymap images update --data-dir data --baseline-url "$DATA_BASE_URL" \
            ${SITE_URL:+--contact "$SITE_URL"} \
            $( [ "$ALLOW_DROP" = "true" ] && echo --allow-drop ) >> "$GITHUB_STEP_SUMMARY"
