name: web

on:
  push:
    branches: [main]
    paths: ["web/**", "pipeline/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "pipeline/**", ".github/workflows/web.yml"]
  # The static pages (o-karti, zemlja/*, objekt/*) and the sitemap are built from the published data, so
  # the site is rebuilt after every successful data build; otherwise they would lag behind the map.
  # prices-daily succeeds once a day after the day-ahead auction: the price and generation pages follow.
  # hep-daily succeeds daily and publishes a snapshot only on a new HEP release; rebuilding then is cheap.
  workflow_run:
    workflows:
      [
        osm-scheduled,
        osm-build,
        prices-daily,
        hep-daily,
        geothermal-update,
        eurostat-update,
        gas-daily,
        capacity-monthly,
      ]
    types: [completed]

permissions:
  contents: read

# Three groups, so that one kind of run never cancels another:
#   code  a push or pull request: checks, e2e, then deploy; a newer push supersedes an older one
#   data  a data workflow succeeded: the code is unchanged, so only the pages are rebuilt and deployed
#   idle  a data workflow failed or was skipped (its schedule switch is off): nothing to do
# Data runs used to share the group of code runs and cancelled their tests half-way, several times a day
# (Faza 31 fixed the same for failed data runs).
concurrency:
  group: web-${{ github.ref }}-${{ github.event_name != 'workflow_run' && 'code' || (github.event.workflow_run.conclusion == 'success' && 'data' || 'idle') }}
  cancel-in-progress: true

jobs:
  # Tests run when the code may have changed. After a data workflow the code is the commit that already
  # passed them at its own push, so repeating 25 minutes of e2e for every daily refresh only burnt Actions
  # minutes (about 1800 a month on a private repository's 2000) and delayed the pages by half an hour.
  check:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check

  e2e:
    needs: check
    runs-on: ubuntu-24.04
    # 198 tests on one worker with software WebGL take about 20 minutes, more when failures are retried
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install tippecanoe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tippecanoe
      - run: python -m pip install -e pipeline
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Fixture data from the real pipeline
        working-directory: web
        run: npm run e2e:data
      # The fixture needs tippecanoe, which has no Windows build: a developer on Windows unpacks this into
      # web/e2e/.data and runs the same tests locally. Invented test data, never published.
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-data
          path: web/e2e/.data
          include-hidden-files: true
          retention-days: 14
      - name: End-to-end tests (desktop and mobile)
        working-directory: web
        env:
          CI: "true"
        run: npx playwright test
      # also when the job is cancelled by its time limit: that is when the report is needed most
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14

  deploy:
    needs: e2e
    # Runs once the Pages project exists and its name is set as the variable PAGES_PROJECT (infra/README.md);
    # before that, checks and e2e still run and the deploy is skipped rather than failing.
    # Secrets are not available to pull requests from forks; those get checks only.
    # always(): after a data workflow the tests are skipped, and a job whose needs were skipped is skipped
    # too unless it says otherwise. A code run still deploys only when its e2e passed.
    if: >-
      always() && vars.PAGES_PROJECT != '' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
       (needs.e2e.result == 'success' &&
        (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write
      actions: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Deploy only code that passed its own tests
        # A data run does not test. It may publish the commit only if that commit's own push run went
        # through checks, e2e and deploy; otherwise a broken commit would go live with the next refresh.
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow web.yml --commit "$GITHUB_SHA" \
            --event push --status success --limit 1 --json databaseId --jq 'length')
          if [ "$passed" != "1" ]; then
            echo "::error::Commit $GITHUB_SHA has no successful 'web' run of its own; the pages are not rebuilt until it has."
            exit 1
          fi
      - run: npm ci
      - name: Check the public address (production)
        # Without SITE_URL the pages have no canonical links, no sitemap and no absolute share image: a
        # production site like that is invisible to search engines, so it is not deployed at all.
        if: github.ref == 'refs/heads/main'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::SITE_URL is not set (Settings → Variables), e.g. https://gridatlas.eu"
            exit 1
          fi
      - name: Build
        env:
          # public R2 URL or custom domain, set under Settings → Variables (the build fails if it is empty)
          VITE_DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
          # public address of the site (custom domain or the pages.dev one) for canonical links and the sitemap
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          VITE_MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
          # "1" switches on the "Support and partners" page and its quiet links (web/src/support.ts); empty: off
          VITE_SUPPORT: ${{ vars.SUPPORT }}
          # IndexNow key (not a secret: it is served as /<key>.txt); without it the announcement is skipped
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: npm run build
      - name: Deploy to Cloudflare Pages (main = production, other branches = preview)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist --project-name=${{ vars.PAGES_PROJECT }} --branch=${{ github.head_ref || github.ref_name }}
      - name: Tell search engines what changed (IndexNow)
        # production only: the key file must be live at SITE_URL before the announcement is valid
        if: github.ref == 'refs/heads/main' && vars.SITE_URL != '' && vars.INDEXNOW_KEY != ''
        continue-on-error: true
        env:
          VITE_DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: npm run notify:indexnow
