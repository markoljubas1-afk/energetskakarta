name: pipeline

on:
  push:
    paths: ["pipeline/**", ".github/workflows/**"] # workflow rules are tested in pipeline/tests
  pull_request:
    paths: ["pipeline/**", ".github/workflows/**"] # workflow rules are tested in pipeline/tests

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install tippecanoe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tippecanoe
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src tests
      - name: Tests
        env:
          ENERGYMAP_REQUIRE_TIPPECANOE: "1"  # tippecanoe tests must run in CI, never skip
        run: pytest
