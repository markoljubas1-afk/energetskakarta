# Daily gas production entering the grid at ENTSOG production points, for the map's gas layer.
# Runs after the gas day closes (06:00 CET) and the operators have reported. No API key is needed.
# If the platform returns nothing usable, the published document is left as it was.
name: gas-daily

on:
  schedule:
    - cron: "40 7 * * *"
    # the evening run is for the storage job: AGSI publishes yesterday's gas day at 19:30 CET, and
    # waiting for the morning made the map a day later than the source (owner's question 2026-11-18).
    # The production job runs too and finds the same day again, which changes nothing.
    - cron: "20 19 * * *"
  workflow_dispatch:
    inputs:
      history_days:
        description: "How many days of gas storage history to read for the month-ends (70 daily; more to fill history)"
        default: "70"
        required: true

permissions:
  contents: read

concurrency:
  group: gas-publish
  cancel-in-progress: true # a newer run supersedes an older one

jobs:
  gas:
    # The schedule is opt-in (SCHEDULE_GAS=true under Settings → Variables), switched on once a manual run has
    # succeeded; until then scheduled runs are skipped instead of failing every time. Manual runs always run.
    if: github.event_name != 'schedule' || vars.SCHEDULE_GAS == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        env:
          HAS_R2: ${{ secrets.R2_ACCOUNT_ID != '' && secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' && secrets.R2_BUCKET != '' }}
        run: |
          if [ "$HAS_R2" != "true" ]; then
            echo "::error::Not configured: R2_* secrets are required (infra/README.md)"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: python -m pip install -e .
      - name: Fetch
        run: energymap gas fetch --data-dir data
      - name: Publish
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: energymap gas publish-r2 --data-dir data

  # What entered the transmission system and where it went (ENTSOG, Faza 44-3): its own job, so a failure
  # here does not hold back production or storage. No API key is needed. A gas day is published in the
  # evening of the day after it, so the evening run brings the new day and the morning run corrections.
  flows:
    if: github.event_name != 'schedule' || vars.SCHEDULE_GAS == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        env:
          HAS_R2: ${{ secrets.R2_ACCOUNT_ID != '' && secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' && secrets.R2_BUCKET != '' }}
        run: |
          if [ "$HAS_R2" != "true" ]; then
            echo "::error::Not configured: R2_* secrets are required (infra/README.md)"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: python -m pip install -e .
      - name: Fetch
        run: energymap gas flows-fetch --data-dir data
      - name: Publish
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: energymap gas flows-publish-r2 --data-dir data

  # Gas in storage (GIE AGSI, Faza 37): its own job, so neither source's failure holds back the other.
  # AGSI publishes a gas day at 19:30 and 23:00 CET: the evening run (19:20 UTC) picks up the first
  # publication, the morning run the corrections of the second.
  # Needs the AGSI_API_KEY secret; without it the job says so and publishes nothing.
  storage:
    if: github.event_name != 'schedule' || vars.SCHEDULE_GAS == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        env:
          HAS_R2: ${{ secrets.R2_ACCOUNT_ID != '' && secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' && secrets.R2_BUCKET != '' }}
          HAS_KEY: ${{ secrets.AGSI_API_KEY != '' }}
        run: |
          if [ "$HAS_R2" != "true" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::error::Not configured: R2_* and AGSI_API_KEY secrets are required (infra/README.md)"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: python -m pip install -e .
      - name: Fetch
        env:
          AGSI_API_KEY: ${{ secrets.AGSI_API_KEY }}
        run: energymap gas storage-fetch --data-dir data
      - name: Publish
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: energymap gas storage-publish-r2 --data-dir data
      - name: Month-end storage by country
        # one figure per country per month, for the monthly reports; published months are kept
        env:
          AGSI_API_KEY: ${{ secrets.AGSI_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          DAYS: ${{ inputs.history_days || '70' }}
        run: energymap gas storage-months-r2 --data-dir data --days "$DAYS"
