[build-system]
requires = ["hatchling>=1.27"] # 1.27: SPDX licence expressions (PEP 639)
build-backend = "hatchling.build"

[project]
name = "energymap"
version = "0.1.0"
description = "Data pipeline for GridAtlas, the regional energy map (Croatia and the wider region)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.36,<2",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "numpy>=1.26",
  "osmium>=4.0,<5",
  "pillow>=10",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
  "shapely>=2.0,<3",
  "tifffile>=2024.1",
]

[project.optional-dependencies]
dev = [
  "boto3-stubs[s3]>=1.36",
  "mypy>=1.11",
  "pytest>=8",
  "ruff>=0.6",
  "types-openpyxl>=3.1",
  "types-pyyaml>=6",
  "types-shapely>=2.0",
]

[project.scripts]
energymap = "energymap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/energymap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["tests", "scripts"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src:scripts"
